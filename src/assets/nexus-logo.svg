<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Primary amber gradient — warm gold from top to bottom -->
    <linearGradient id="lyx-bg" x1="12" y1="4" x2="52" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.4" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <!-- Inner L stroke gradient — white to amber-tinted -->
    <linearGradient id="lyx-stroke" x1="20" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <!-- Spark gradient — electric cyan-to-white for contrast -->
    <linearGradient id="lyx-spark" x1="40" y1="14" x2="52" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Ethiopian flag gradient -->
    <linearGradient id="etflag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#009A44"/>
      <stop offset="0.5" stop-color="#FCDD09"/>
      <stop offset="1" stop-color="#DA121A"/>
    </linearGradient>
    <!-- Glow filter for the spark -->
    <filter id="spark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded rect with warm amber gradient -->
  <rect width="64" height="64" rx="16" fill="url(#lyx-bg)"/>

  <!-- Subtle inner highlight — top edge glow for 3D depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>

  <!-- The L — bold, geometric, with a subtle 3D bevel effect via a double stroke -->
  <!-- Outer stroke (slightly darker, creates depth shadow) -->
  <path d="M22 14 L22 50 L46 50" stroke="#78350f" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <!-- Inner stroke (the bright L itself, white-to-gold gradient) -->
  <path d="M22 14 L22 50 L46 50" stroke="url(#lyx-stroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- The spark — an electric geometric accent at the top-right of the L -->
  <!-- A 4-point star/diamond shape suggesting knowledge ignition -->
  <g filter="url(#spark-glow)">
    <path d="M44 14 L48 18 L44 22 L40 18 Z" fill="url(#lyx-spark)" opacity="0.95"/>
    <!-- Inner spark core — bright white dot -->
    <circle cx="44" cy="18" r="1.5" fill="white" opacity="0.9"/>
  </g>

  <!-- Secondary spark trail — small particles trailing from the spark -->
  <circle cx="50" cy="12" r="1" fill="#67e8f9" opacity="0.6"/>
  <circle cx="52" cy="16" r="0.8" fill="#22d3ee" opacity="0.4"/>
  <circle cx="48" cy="8" r="0.6" fill="#67e8f9" opacity="0.3"/>

  <!-- Ethiopian flag stripe — left edge, same position as before -->
  <rect x="2.5" y="2.5" width="5" height="59" rx="2.5" fill="url(#etflag)" opacity="0.95"/>
</svg>
