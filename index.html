<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Academy — Ethiopian National Exam Prep Library</title>
  <script>
    // Apply theme before first paint to prevent light-theme flash.
    // Default is dark; only switch to light if explicitly saved.
    (function () {
      try {
        var t = localStorage.getItem("nexus-theme");
        if (t !== "light") t = "dark";
      } catch (e) {
        t = "dark";
      }
      var el = document.documentElement;
      el.classList.remove("dark", "light");
      el.classList.add(t);
      el.style.colorScheme = t;
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0B0F17;color:#94a3b8;font-family:system-ui,sans-serif;text-align:center;padding:1.5rem">
      <div>
        <p style="font-size:1.125rem;font-weight:600;color:#e2e8f0">JavaScript Required</p>
        <p style="margin-top:.5rem;font-size:.875rem">Nexus Academy requires JavaScript to run. Please enable it and reload.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
