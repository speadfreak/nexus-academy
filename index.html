<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <!-- iOS — apple-touch-icon is required for "Add to Home Screen" on iPhone/iPad.
       iOS ignores the manifest icons array for the home screen icon. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA — theme-color drives the browser UI chrome color on mobile.
       Light is the default; ThemeProvider keeps this in sync on toggle. -->
  <meta name="theme-color" content="#F7F5F0" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0A08" />
  <!-- iOS — supports standalone mode (no Safari chrome) when launched from home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Learnyx ET" />
  <!-- Prevent browser/CDN from caching index.html so stale chunk hashes never load -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Speed: warm up the connection to the R2 asset host BEFORE the app
       discovers any PDF URL — saves a full DNS+TLS round-trip (100-400ms)
       on every first document open, especially on mobile networks. -->
  <link rel="preconnect" href="https://pub-ed4ccd3a1b864e50a887a2ab1fc3dc18.r2.dev" crossorigin />
  <link rel="dns-prefetch" href="https://pub-ed4ccd3a1b864e50a887a2ab1fc3dc18.r2.dev" />
  <title>Learnyx Academy ET 🇪🇹 — Ethiopian National Exam Prep Library</title>

  <!-- ═══════════════════════════════════════════════════════════════════
       INLINE RECOVERY SYSTEM — runs before ANY JS module loads.
       Catches: stale chunks, CORS failures, network errors, CSS failures,
       and React failing to mount. Uses sessionStorage (not URL params)
       so normal refreshes are never affected.
       ═══════════════════════════════════════════════════════════════════ -->
  <style>
    /* CSS-only loading state — visible BEFORE React mounts.
       Light is the default; html.dark flips it (the anti-flash script
       below sets the class before first paint). */
    #nexus-boot-screen {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F7F5F0; color: #64748b; font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.3s ease;
    }
    html.dark #nexus-boot-screen { background: #0B0A08; color: #B9B2A4; }
    #nexus-boot-screen.nexus-hidden { opacity: 0; pointer-events: none; }
    #nexus-boot-screen .nexus-boot-logo {
      width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      border: 1px solid rgba(217,119,6,0.35);
      background: linear-gradient(135deg, rgba(251,191,36,0.30) 0%, rgba(245,158,11,0.16) 40%, rgba(180,83,9,0.08) 100%);
      font-family: Georgia, serif; font-size: 28px; font-weight: 900;
      color: #b45309;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      animation: nexus-pulse 2s ease-in-out infinite;
      box-shadow: 0 2px 12px -2px rgba(180,83,9,0.25), inset 0 1px 0 rgba(255,255,255,0.7);
    }
    html.dark #nexus-boot-screen .nexus-boot-logo {
      border-color: rgba(251,191,36,0.35);
      background: linear-gradient(135deg, rgba(251,191,36,0.25) 0%, rgba(245,158,11,0.12) 40%, rgba(146,64,14,0.08) 100%);
      color: #fcd34d;
      text-shadow: 0 0 12px rgba(251,191,36,0.5), 0 0 24px rgba(245,158,11,0.3);
      box-shadow: 0 0 20px -4px rgba(251,191,36,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    #nexus-boot-screen .nexus-boot-text {
      margin-top: 20px; font-family: monospace; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.3em; color: #78716c;
    }
    html.dark #nexus-boot-screen .nexus-boot-text { color: #B9B2A4; }
    @keyframes nexus-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217,119,6,0.18); }
      50% { box-shadow: 0 0 36px -5px rgba(217,119,6,0.28); }
    }
    html.dark #nexus-boot-screen {
      animation-name: none;
    }
    html.dark #nexus-boot-screen .nexus-boot-logo {
      animation: nexus-pulse-dark 2s ease-in-out infinite;
    }
    @keyframes nexus-pulse-dark {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.2); }
      50% { box-shadow: 0 0 40px -5px rgba(251,191,36,0.3); }
    }
    /* Error recovery UI — shown when boot fails (theme-aware) */
    #nexus-recovery {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: #F7F5F0; color: #1e293b; font-family: system-ui, -apple-system, sans-serif;
      flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      text-align: center;
    }
    html.dark #nexus-recovery { background: #0B0A08; color: #F4F0E7; }
    #nexus-recovery.nexus-visible { display: flex; }
    #nexus-recovery .nexus-recovery-card {
      max-width: 400px; background: rgb(15 23 42 / 0.03); border: 1px solid rgb(15 23 42 / 0.1);
      border-radius: 16px; padding: 32px;
    }
    html.dark #nexus-recovery .nexus-recovery-card {
      background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08);
    }
    #nexus-recovery .nexus-recovery-title { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 8px; }
    #nexus-recovery .nexus-recovery-msg { font-size: 13px; color: #64748b; margin-bottom: 20px; word-break: break-word; }
    html.dark #nexus-recovery .nexus-recovery-title { color: #f8fafc; }
    #nexus-recovery .nexus-recovery-btn {
      display: inline-block; padding: 10px 24px; border-radius: 12px; border: none;
      background: #f59e0b; color: #0B0A08; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    #nexus-recovery .nexus-recovery-btn:hover { opacity: 0.9; }
    #nexus-recovery .nexus-recovery-count { margin-top: 12px; font-size: 11px; color: #475569; }
  </style>
  <script>
  (function() {
    'use strict';
    var STORAGE_KEY = '__nexus_reload_count';
    var MAX_RETRIES = 3;

    // Read retry count from sessionStorage (per-tab, cleared on tab close)
    function getRetryCount() {
      try { return parseInt(sessionStorage.getItem(STORAGE_KEY) || '0', 10); } catch(e) { return 0; }
    }
    function setRetryCount(n) {
      try { sessionStorage.setItem(STORAGE_KEY, String(n)); } catch(e) {}
    }
    function clearRetryCount() {
      try { sessionStorage.removeItem(STORAGE_KEY); } catch(e) {}
    }

    // Hide boot screen and show recovery UI
    function showRecovery(message) {
      var boot = document.getElementById('nexus-boot-screen');
      var recovery = document.getElementById('nexus-recovery');
      var msgEl = document.getElementById('nexus-recovery-message');
      var countEl = document.getElementById('nexus-recovery-count');
      if (boot) boot.classList.add('nexus-hidden');
      if (recovery) {
        recovery.classList.add('nexus-visible');
        if (msgEl) msgEl.textContent = message || 'Unknown error occurred.';
        if (countEl) {
          var count = getRetryCount();
          countEl.textContent = count > 0 ? 'Auto-retry attempted ' + count + ' time(s)' : '';
        }
      }
    }

    // Cache-busting reload with retry counting
    function forceReload(reason) {
      var count = getRetryCount();
      if (count >= MAX_RETRIES) {
        // Too many retries — show manual recovery UI
        showRecovery('The app failed to load after multiple attempts. Please tap Retry or clear your browser cache.');
        return;
      }
      setRetryCount(count + 1);
      console.warn('[Nexus] Reloading (' + (count+1) + '/' + MAX_RETRIES + '): ' + reason);
      // Use location.replace with a cache-busting query param, then
      // immediately remove it via replaceState so the URL stays clean.
      var url = new URL(location.href);
      url.searchParams.set('_t', String(Date.now()));
      location.replace(url.toString());
    }

    // ── 1. Catch failed <script> loads (including the main entry) ──
    window.addEventListener('error', function(e) {
      var el = e.target;
      if (!el || !el.tagName) return;
      var tag = el.tagName.toUpperCase();
      var src = el.src || el.href || '';

      if (tag === 'SCRIPT' && src) {
        // Script failed to load — stale chunk, CORS, network error
        console.error('[Nexus] Script failed to load:', src);
        e.preventDefault();
        forceReload('Script failed: ' + src);
      }

      if (tag === 'LINK' && el.rel === 'stylesheet' && src) {
        // CSS failed — page would be unstyled, force reload
        console.error('[Nexus] Stylesheet failed to load:', src);
        e.preventDefault();
        forceReload('Stylesheet failed: ' + src);
      }
    }, true); // capture phase

    // ── 2. Catch failed dynamic imports (React.lazy / import()) ──
    window.addEventListener('unhandledrejection', function(e) {
      var msg = (e.reason && e.reason.message) || String(e.reason || '');
      if (
        msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
        msg.indexOf('Loading chunk') !== -1 ||
        msg.indexOf('Importing a module script failed') !== -1 ||
        msg.indexOf('NetworkError') !== -1 ||
        msg.indexOf('Failed to load') !== -1
      ) {
        e.preventDefault();
        forceReload('Dynamic import failed: ' + msg);
      }
    });

    // ── 3. React mount timeout — if React hasn't mounted in 10s, something is wrong ──
    window.__NEXUS_MOUNTED = false;
    setTimeout(function() {
      if (!window.__NEXUS_MOUNTED) {
        console.error('[Nexus] React did not mount within 10 seconds');
        var count = getRetryCount();
        if (count < MAX_RETRIES) {
          forceReload('React mount timeout (10s)');
        } else {
          showRecovery('The app is taking too long to load. This may be a network issue. Please check your connection and tap Retry.');
        }
      } else {
        // React mounted — clear retry count for next refresh
        clearRetryCount();
      }
    }, 10000);

    // ── 4. Clean up the cache-busting param from URL after load ──
    // This runs after the page loads successfully — removes the _t param.
    window.addEventListener('load', function() {
      var url = new URL(location.href);
      if (url.searchParams.has('_t')) {
        url.searchParams.delete('_t');
        history.replaceState(null, '', url.pathname + url.hash);
      }
    });

    // Expose showRecovery globally for React error boundaries to use
    window.__NEXUS_SHOW_RECOVERY = showRecovery;
  })();
  </script>
  <script>
    // Apply theme before first paint to prevent a wrong-theme flash.
    // Light is the DEFAULT Learnyx experience. A stored theme is only
    // honored when the user made an explicit choice (nexus-theme-explicit
    // flag) — legacy installs auto-wrote "dark" on every load, so the flag
    // is what separates "chose dark" from "was defaulted dark". A stored
    // "system" follows the OS via matchMedia. This logic MUST mirror
    // readStoredTheme()/resolve() in theme-provider.tsx.
    (function () {
      var explicit = false;
      var t = "light";
      try {
        explicit = localStorage.getItem("nexus-theme-explicit") === "1";
        if (explicit) {
          var stored = localStorage.getItem("nexus-theme");
          if (stored === "light" || stored === "dark") t = stored;
          if (stored === "system") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        }
      } catch (e) {
        t = "light";
      }
      var el = document.documentElement;
      el.classList.remove("dark", "light");
      el.classList.add(t);
      el.style.colorScheme = t;
    })();
  </script>
</head>


<body>
  <!-- CSS-only boot screen: visible before React mounts -->
  <div id="nexus-boot-screen">
    <div class="nexus-boot-logo">L</div>
    <div class="nexus-boot-text">Learnyx Academy ET 🇪🇹</div>
  </div>

  <!-- Recovery UI: shown when boot fails after max retries -->
  <div id="nexus-recovery">
    <div class="nexus-recovery-card">
      <div class="nexus-recovery-title">Failed to load Learnyx Academy ET 🇪🇹</div>
      <div class="nexus-recovery-msg" id="nexus-recovery-message">Unknown error.</div>
      <button class="nexus-recovery-btn" onclick="sessionStorage.clear();location.href=location.pathname">Retry</button>
      <div class="nexus-recovery-count" id="nexus-recovery-count"></div>
    </div>
  </div>

  <div id="root"></div>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0B0A08;color:#B9B2A4;font-family:system-ui,sans-serif;text-align:center;padding:1.5rem">
      <div>
        <p style="font-size:1.125rem;font-weight:600;color:#F4F0E7">JavaScript Required</p>
        <p style="margin-top:.5rem;font-size:.875rem">Learnyx Academy ET 🇪🇹 requires JavaScript to run. Please enable it and reload.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
