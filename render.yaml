# Render blueprint — Nexus Academy frontend (static site).
#
# The app is a Vite/React SPA. The Convex backend is deployed separately
# (hosted at https://hearty-seahorse-455.convex.cloud). Render only builds
# and serves the static frontend from ./dist.
#
# AI keys (XAI_API_KEY, GEMINI_API_KEY, YOUTUBE_API_KEY) and other secrets
# are stored in the database via the admin panel (Keys tab) — not as env vars.
#
# IMPORTANT: Convex functions are deployed SEPARATELY from the frontend.
# When you change files in src/convex/, run `npx convex deploy` LOCALLY to
# push those changes to Convex cloud. The Render build does NOT do this.

services:
  - type: web
    name: nexus-academy
    runtime: static
    buildCommand: |
      set -e
      if command -v bun >/dev/null 2>&1; then
        bun install && bun run build
      else
        npm install --no-audit --no-fund && npm run build
      fi
    staticPublishPath: ./dist
    envVars:
      # Vite 7 requires Node >= 20.19 / >= 22.12 — pin an LTS so the build
      # image doesn't fall back to an old default.
      - key: NODE_VERSION
        value: 22.14.0
      # The Convex backend URL this frontend talks to.
      - key: VITE_CONVEX_URL
        value: https://hearty-seahorse-455.convex.cloud
      # Optional Vly platform telemetry (error reporting). Safe to leave
      # unset — the app no-ops without them.
      - key: VITE_VLY_APP_ID
        sync: false
      - key: VITE_VLY_MONITORING_URL
        sync: false
    routes:
      # SPA fallback: any unknown path serves index.html so client-side
      # routing works on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
